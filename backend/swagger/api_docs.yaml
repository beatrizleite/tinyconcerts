
swagger: "2.0"
info:
  title: tinyConcerts API
  description: this is the tinyConcerts API :D
  version: 1.0.0
basePath: /
schemes:
  - http
paths:
  /api/auth/logout:
    post:
      summary: Logout
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            example:
              token: token
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/auth/login:
    post:
      summary: Login
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            example:
              username: username
              password: password
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/user:
    post:
      summary: Create User
      tags:
        - User
      requestBody:
        content:
          application/json:
            example:
              fname: fname
              lname: lname
              username: username
              email: email
              birthday: birthday
              password: password
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    get:
      summary: Get User By Id
      tags:
        - User
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          example: "123"
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    put:
      summary: Update User
      tags:
        - User
      requestBody:
        content:
          application/json:
            example:
              user_id: user_id
              fname: fname
              lname: lname
              username: username
              email: email
              birthday: birthday
              password: password
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    delete:
      summary: Delete User
      tags:
        - User
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: number
        example: "123"
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/user/all:
    get:
      summary: Get All Users
      tags:
        - User
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/user/achievements:
    get:
      summary: Get User Achievement By Id
