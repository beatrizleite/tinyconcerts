
swagger: "2.0"
info:
  title: tinyConcerts API
  description: this is the tinyConcerts API :D
  version: 1.0
basePath: /
schemes:
  - https
  - http
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: >
      Enter your JWT token like this: Bearer <token>
security:
  - Bearer: []
paths:
  /api/auth/login:
    post:
      summary: Login
      tags:
        - Authentication
      consumes:
        - application/json
      parameters:
        - in: body
          name: credentials
          required: true
          schema:
            type: object
            required:
              - username
              - password
            properties:
              username:
                type: string
              password:
                type: string
            example:
              username: johndoe
              password: secret123
      responses:
        '200':
          description: Login successful
          schema:
            type: object
            properties:
              token:
                type: string
        '400':
          description: Missing or invalid input
        '403':
          description: Forbidden - invalid credentials
        '500':
          description: Internal server error

  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      consumes:
        - application/json
      parameters:
        - in: body
          name: user
          required: true
          schema:
            type: object
            required:
              - fname
              - lname
              - username
              - email
              - birthday
              - password
            properties:
              fname:
                type: string
              lname:
                type: string
              username:
                type: string
              email:
                type: string
                format: email
              birthday:
                type: string
                format: date
              password:
                type: string
            example:
              fname: John
              lname: Doe
              username: johndoe
              email: john@example.com
              birthday: 1990-01-01
              password: secret123
      responses:
        '201':
          description: User created successfully
          schema:
            type: object
            properties:
              id:
                type: string
              username:
                type: string
        '400':
          description: Missing or invalid input
        '409':
          description: Conflict - username or email already exists
        '500':
          description: Internal server error

  /api/auth/logout:
    post:
      summary: Logout
      tags:
        - Authentication
      responses:
        '200':
          description: Logout successful
        '400':
          description: Missing or invalid input
        '403':
          description: Forbidden - invalid token
        '500':
          description: Internal server error

  /api/user:
    post:
      summary: Create User (Admin only)
      tags:
        - User
      consumes:
        - application/json
      parameters:
        - in: body
          name: user
          required: true
          schema:
            type: object
            required:
              - fname
              - lname
              - username
              - email
              - birthday
              - password
              - role
            properties:
              fname:
                type: string
              lname:
                type: string
              username:
                type: string
              email:
                type: string
                format: email
              birthday:
                type: string
                format: date
              password:
                type: string
              role:
                type: integer
                description: User role (e.g., 0 = normal user, 1 = admin)
            example:
              fname: Jane
              lname: Smith
              username: janesmith
              email: jane@example.com
              birthday: 1988-07-15
              password: adminpass
              role: 1
      responses:
        '201':
          description: User created successfully
          schema:
            type: object
            properties:
              id:
                type: string
              username:
                type: string
              role:
                type: integer
        '400':
          description: Missing or invalid input
        '409':
          description: Conflict - username or email already exists
        '500':
          description: Internal server error

    get:
      summary: Get User By Id
      tags:
        - User
      parameters:
        - name: user_id
          in: query
          required: true
          type: string
          example: "123"
      responses:
        '200':
          description: User found
          schema:
            type: object
            properties:
              id:
                type: string
              username:
                type: string
        '404':
          description: User not found
        '400':
          description: Missing or invalid user_id
        '500':
          description: Internal server error

    put:
      summary: Update User
      tags:
        - User
      consumes:
        - application/json
      parameters:
        - in: body
          name: user
          required: true
          schema:
            type: object
            required:
              - id
            properties:
              id:
                type: string
              fname:
                type: string
              lname:
                type: string
              username:
                type: string
              email:
                type: string
              birthday:
                type: string
                format: date
              password:
                type: string
            example:
              id: "123"
              fname: Jane
              lname: Doe
              username: janedoe
              email: jane@example.com
              birthday: 1992-02-02
              password: newpassword
      responses:
        '200':
          description: User updated successfully
          schema:
            type: object
            properties:
              message:
                type: string
                example: User updated
        '400':
          description: Missing user id or invalid input
        '404':
          description: User not found
        '500':
          description: Internal server error

    delete:
      summary: Delete User
      tags:
        - User
      parameters:
        - name: user_id
          in: query
          required: true
          type: string
          example: "123"
      responses:
        '200':
          description: User deleted successfully
          schema:
            type: object
            properties:
              message:
                type: string
                example: User deleted
        '404':
          description: User not found
        '400':
          description: Missing or invalid user_id
        '500':
          description: Internal server error

  /api/user/all:
    get:
      summary: Get All Users
      tags:
        - User
      responses:
        '200':
          description: List of users
          schema:
            type: array
            items:
              type: object
              properties:
                id:
