      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/playlist:
    post:
      summary: Create Playlist
      tags:
        - Playlist
      requestBody:
        content:
          application/json:
            example:
              user_id: user_id
              name: My Rock Playlist
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    get:
      summary: Get Playlist by Id
      tags:
        - Playlist
      parameters:
        - name: playlist_id
          in: query
          required: true
          schema:
            type: string
          example: "123"
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error      
    put:
      summary: Update Playlist
      tags:
        - Playlist
      requestBody:
        content:
          application/json:
            example:
              playlist_id: playlist_id
              user_id: user_id
              name: My Rock Playlist
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    delete:
      summary: Delete Playlist
      tags:
        - Playlist
      parameters:
      - name: playlist_id
        in: query
        required: true
        schema:
          type: number
        example: "123"
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
