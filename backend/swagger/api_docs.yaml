basePath: /
info:
  description: this is the tinyConcerts API :D
  title: tinyConcerts API
  version: 1.0
paths:
  /api/achievement:
    get:
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Achievement
      tags:
      - Achievement
    post:
      requestBody:
        content:
          application/json:
            example:
              achievement_id: achievement_id
              description: description
              name: name
              required_count: required_count
              type: VIEWS/COMMENTS/LIKES
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Update Achievement
      tags:
      - Achievement
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - in: body
        name: credentials
        required: true
        schema:
          example:
            password: secret123
            username: johndoe
          properties:
            password:
              type: string
            username:
              type: string
          required:
          - username
          - password
          type: object
      responses:
        '200':
          description: Login successful
          schema:
            properties:
              token:
                type: string
            type: object
        '400':
          description: Missing or invalid input
        '403':
          description: Forbidden - invalid credentials
        '500':
          description: Internal server error
      summary: Login
      tags:
      - Authentication
  /api/auth/logout:
    post:
      responses:
        '200':
          description: Logout successful
        '400':
          description: Missing or invalid input
        '403':
          description: Forbidden - invalid token
        '500':
          description: Internal server error
      summary: Logout
      tags:
      - Authentication
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - in: body
        name: user
        required: true
        schema:
          example:
            birthday: 1990-01-01
            email: john@example.com
            fname: John
            lname: Doe
            password: secret123
            username: johndoe
          properties:
            birthday:
              format: date
              type: string
            email:
              format: email
              type: string
            fname:
              type: string
            lname:
              type: string
            password:
              type: string
            username:
              type: string
          required:
          - fname
          - lname
          - username
          - email
          - birthday
          - password
          type: object
      responses:
        '201':
          description: User created successfully
          schema:
            properties:
              id:
                type: string
              username:
                type: string
            type: object
        '400':
          description: Missing or invalid input
        '409':
          description: Conflict - username or email already exists
        '500':
          description: Internal server error
      summary: Register a new user
      tags:
      - Authentication
  /api/comment:
    delete:
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Delete Comment
      tags:
      - Comment
    get:
      parameters:
      - example: '123'
        in: query
        name: comment_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Comments By Id
      tags:
      - Comment
    post:
      requestBody:
        content:
          application/json:
            example:
              comment_text: This is an amazing concert!
              user_id: user_id
              video_id: video_id
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Create Comment
      tags:
      - Comment
    put:
      requestBody:
        content:
          application/json:
            example:
              comment_id: comment_id
              comment_text: This concert was absolutely phenomenal!
              user_id: user_id
              video_id: video_id
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Update Comment
      tags:
      - Comment
  /api/comment/report:
    post:
      requestBody:
        content:
          application/json:
            example:
              comment_id: comment_id
              report_reason: Inappropriate content
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Report Comment
      tags:
      - Comment
  /api/comment/user:
    get:
      parameters:
      - example: '123'
        in: query
        name: user_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Comments Per User
      tags:
      - Comment
  /api/comment/video:
    get:
      parameters:
      - example: '123'
        in: query
        name: video_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Comments Per Video
      tags:
      - Comment
  /api/like:
    post:
      description: Toggle like status for a video by the authenticated user.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                like:
                  type: boolean
                video_id:
                  type: integer
              required:
              - video_id
              - like
              type: object
        required: true
      responses:
        '200':
          description: Like status updated successfully.
        '400':
          description: Invalid input data.
        '401':
          description: Unauthorized.
      summary: Update like status for a video
      tags:
      - like
  /api/like/user:
    get:
      description: Retrieve a list of likes by the authenticated user.
      parameters: []
      responses:
        '200':
          description: List of liked videos.
        '401':
          description: Unauthorized.
      summary: Get likes by the authenticated user
      tags:
      - like
  /api/like/video:
    get:
      description: Retrieve a list of likes for a specific video.
      parameters:
      - description: ID of the video
        in: query
        name: video_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: List of likes for the video.
        '400':
          description: Invalid video ID.
      summary: Get likes for a specific video
      tags:
      - like
  /api/like/user:
    get:
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Likes Per User
      tags:
      - Like
  /api/like/video:
    get:
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Likes Per Video
      tags:
      - Like
  /api/playlist:
    delete:
      parameters:
      - example: '123'
        in: query
        name: playlist_id
        required: true
        schema:
          type: number
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Delete Playlist
      tags:
      - Playlist
    get:
      parameters:
      - example: '123'
        in: query
        name: playlist_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Playlist by Id
      tags:
      - Playlist
    post:
      requestBody:
        content:
          application/json:
            example:
              name: My Rock Playlist
              user_id: user_id
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Create Playlist
      tags:
      - Playlist
    put:
      requestBody:
        content:
          application/json:
            example:
              name: My Rock Playlist
              playlist_id: playlist_id
              user_id: user_id
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Update Playlist
      tags:
      - Playlist
  /api/playlist/user:
    get:
      parameters:
      - example: '123'
        in: query
        name: user_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Playlists By User
      tags:
      - Playlist
  /api/playlist/video:
    delete:
      parameters:
      - example: '123'
        in: query
        name: video_id
        required: true
        schema:
          type: number
      - example: '123'
        in: query
        name: playlist_id
        required: true
        schema:
          type: number
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Delete Video From Playlist
      tags:
      - Playlist
  /api/rating:
    get:
      parameters:
      - example: '123'
        in: query
        name: video_id
        required: true
        schema:
          type: number
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Average Rating for Video
      tags:
      - Rating
    post:
      requestBody:
        content:
          application/json:
            example:
              rating: 0-5
              user_id: user_id
              video_id: video_id
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Create Rating for Video
      tags:
      - Rating
  /api/report:
    get:
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get All Reports
      tags:
      - Report
  /api/report/comment:
    get:
      parameters:
      - example: '123'
        in: query
        name: comment_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Reports For Comment
      tags:
      - Report
  /api/report/status:
    patch:
      requestBody:
        content:
          application/json:
            example:
              report_id: report_id
              status: approved/rejected
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Update Report Status
      tags:
      - Report
  /api/report/user:
    get:
      parameters:
      - example: '123'
        in: query
        name: user_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Reports Made By User
      tags:
      - Report
  /api/report/video:
    get:
      parameters:
      - example: '123'
        in: query
        name: video_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Reports For Video
      tags:
      - Report
  /api/user:
    delete:
      parameters:
      - example: '123'
        in: query
        name: user_id
        required: true
        type: string
      responses:
        '200':
          description: User deleted successfully
          schema:
            properties:
              message:
                example: User deleted
                type: string
            type: object
        '400':
          description: Missing or invalid user_id
        '404':
          description: User not found
        '500':
          description: Internal server error
      summary: Delete User
      tags:
      - User
    get:
      parameters:
      - example: '123'
        in: query
        name: user_id
        required: true
        type: string
      responses:
        '200':
          description: User found
          schema:
            properties:
              id:
                type: string
              username:
                type: string
            type: object
        '400':
          description: Missing or invalid user_id
        '404':
          description: User not found
        '500':
          description: Internal server error
      summary: Get User By Id
      tags:
      - User
    post:
      consumes:
      - application/json
      parameters:
      - in: body
        name: user
        required: true
        schema:
          example:
            birthday: 1988-07-15
            email: jane@example.com
            fname: Jane
            lname: Smith
            password: adminpass
            role: 1
            username: janesmith
          properties:
            birthday:
              format: date
              type: string
            email:
              format: email
              type: string
            fname:
              type: string
            lname:
              type: string
            password:
              type: string
            role:
              description: User role (e.g., 0 = normal user, 1 = admin)
              type: integer
            username:
              type: string
          required:
          - fname
          - lname
          - username
          - email
          - birthday
          - password
          - role
          type: object
      responses:
        '201':
          description: User created successfully
          schema:
            properties:
              id:
                type: string
              role:
                type: integer
              username:
                type: string
            type: object
        '400':
          description: Missing or invalid input
        '409':
          description: Conflict - username or email already exists
        '500':
          description: Internal server error
      summary: Create User (Admin only)
      tags:
      - User
    put:
      consumes:
      - application/json
      parameters:
      - in: body
        name: user
        required: true
        schema:
          example:
            birthday: 1992-02-02
            email: jane@example.com
            fname: Jane
            id: '123'
            lname: Doe
            password: newpassword
            username: janedoe
          properties:
            birthday:
              format: date
              type: string
            email:
              type: string
            fname:
              type: string
            id:
              type: string
            lname:
              type: string
            password:
              type: string
            username:
              type: string
          required:
          - id
          type: object
      responses:
        '200':
          description: User updated successfully
          schema:
            properties:
              message:
                example: User updated
                type: string
            type: object
        '400':
          description: Missing user id or invalid input
        '404':
          description: User not found
        '500':
          description: Internal server error
      summary: Update User
      tags:
      - User
  /api/user/achievements:
    get:
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get User Achievement By Id
      tags:
      - User
  /api/user/all:
    get:
      responses:
        '200':
          description: List of users
          schema:
            items:
              properties:
                id:
                  type: string
                username:
                  type: string
              type: object
            type: array
        '500':
          description: Internal server error
      summary: Get All Users
      tags:
      - User
  /api/video:
    delete:
      parameters:
      - example: '123'
        in: query
        name: video_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Delete Video
      tags:
      - Video
    get:
      parameters:
      - example: '123'
        in: query
        name: video_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get Video By Id
      tags:
      - Video
    post:
      requestBody:
        content:
          application/json:
            example:
              category: Pop
              description: Amazing live show!
              image_320_180: https://example.com/thumb.jpg
              owner: Artist Name
              owner_url: https://example.com/artist
              published_at: '2025-04-01T12:00:00Z'
              title: New Concert
              video_link: https://example.com/newvideo
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Create Video
      tags:
      - Video
    put:
      requestBody:
        content:
          application/json:
            example:
              category: Pop
              description: Amazing live show!
              image_320_180: https://example.com/thumb.jpg
              owner: Artist Name
              owner_url: https://example.com/artist
              published_at: '2025-04-01T12:00:00Z'
              title: New Concert
              video_id: id
              video_link: https://example.com/newvideo
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Update Video
      tags:
      - Video
  /api/video/report:
    post:
      requestBody:
        content:
          application/json:
            example:
              report_reason: Inappropriate content
              video_id: video_id
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Report a Video
      tags:
      - Video
  /api/video/search:
    get:
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Search videos
      tags:
      - Video
schemes:
- https
- http
security:
- Bearer: []
securityDefinitions:
  Bearer:
    description: 'Enter your JWT token like this: Bearer <token>

      '
    in: header
    name: Authorization
    type: apiKey
swagger: '2.0'
