      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/video:
    post:
      summary: Create Video
      tags:
        - Video
      requestBody:
        content:
          application/json:
            example:
              title: New Concert
              description: Amazing live show!
              video_link: https://example.com/newvideo
              category: Pop
              published_at: '2025-04-01T12:00:00Z'
              owner: Artist Name
              owner_url: https://example.com/artist
              image_320_180: https://example.com/thumb.jpg
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    get:
      summary: Get Video By Id
      tags:
        - Video
      parameters:
        - name: video_id
          in: query
          required: true
          schema:
            type: string
          example: "123"
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    put:
      summary: Update Video
      tags:
        - Video
      requestBody:
        content:
          application/json:
            example:
              video_id: id
              title: New Concert
              description: Amazing live show!
              video_link: https://example.com/newvideo
              category: Pop
              published_at: '2025-04-01T12:00:00Z'
              owner: Artist Name
              owner_url: https://example.com/artist
              image_320_180: https://example.com/thumb.jpg
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    delete:
      summary: Delete Video
      tags:
        - Video
      parameters:
      - name: video_id
        in: query
        required: true
        schema:
          type: string
        example: "123"
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/video/search:
    get:
        summary: Search videos
        tags:
          - Video
        responses:
          '200':
            description: Success
          '400':
            description: Bad Request
          '403':
            description: Forbidden
          '404':
            description: Not Found
          '500':
            description: Internal Server Error
  /api/video/report:
    post:
