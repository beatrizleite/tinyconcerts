        in: query
        required: true
        schema:
          type: number
        example: "123"
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/like:
    post:
      summary: Update Like Status
      tags:
        - Like
      requestBody:
        content:
          application/json:
            example:
              user_id: user_id
              video_id: video_id
              like: true
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
